name: Global Automerge
permissions:
  contents: read

on:
  schedule:
    # 1 実行で 1 リポジトリ最大 1 PR のため、消化速度はこの間隔で決まる。
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "マージせず、対象の判定結果だけを表示する"
        type: boolean
        default: false
      repository:
        description: "対象を 1 リポジトリに限定する (owner/name)。空なら App のインストール先すべて"
        type: string
        default: ""

# 同時に 2 本走ると 1 実行 1 PR の直列化が崩れるため、重複実行を許さない。
concurrency:
  group: global-automerge
  cancel-in-progress: false

jobs:
  automerge:
    # GitHub App の設定前に定期実行が失敗し続けないよう、変数の登録を有効化の条件にする。
    if: ${{ vars.GLOBAL_AUTOMERGE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.GLOBAL_AUTOMERGE_CLIENT_ID }}
          private-key: ${{ secrets.GLOBAL_AUTOMERGE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read

      - name: Merge at most one Renovate PR per repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$TARGET_REPOSITORY" ]; then args+=(--repo "$TARGET_REPOSITORY"); fi
          bun scripts/global-automerge.js "${args[@]}"

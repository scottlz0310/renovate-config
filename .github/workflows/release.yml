---
name: Release

# prepare-release.yml が作る `chore(release): vX.Y.Z` PR のマージ（main への push）で起動する。
# draft（tag と draft Release の作成）→ publish（検証して npm へ公開）
# → verify-package（公開物の照合）→ finalize（Release の公開）の順に進む。
# npm の Trusted Publisher は repo とこの workflow のファイル名（release.yml）に紐づくため、名前を変えない。

"on":
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  draft:
    if: startsWith(github.event.head_commit.message, 'chore(release):')
    uses: scottlz0310/release-automate/.github/workflows/reusable-publish-release.yml@3c860f1b178eb5b942d87c800153bc47887a7bfd # v3.2.1
    permissions:
      contents: write
    with:
      draft: true

  publish:
    needs: draft
    if: needs.draft.outputs.release_state == 'draft'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: npm-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft.outputs.target_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package version matches tag
        env:
          TAG: ${{ needs.draft.outputs.tag_name }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${TAG#v}" ]; then
            echo "::error::Version mismatch: tag=${TAG#v} package.json=$PKG_VERSION"
            exit 1
          fi

      - name: Run checks
        run: bun run check:ci

      - name: Build CLI
        run: bun run build

      - name: Pack and verify tarball
        run: |
          set -euo pipefail
          npm pack --pack-destination package-output
          packages=(package-output/*.tgz)
          test "${#packages[@]}" = 1
          tar -tzf "${packages[0]}" > package-files.txt
          grep -qx 'package/dist/index.js' package-files.txt
          grep -q '^package/presets/' package-files.txt

      - name: Upload npm payload
        uses: actions/upload-artifact@v7
        with:
          name: npm-payload
          path: package-output/*.tgz
          if-no-files-found: error

      - name: Publish to npm
        env:
          TAG: ${{ needs.draft.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          unset NODE_AUTH_TOKEN
          unset NPM_CONFIG_USERCONFIG

          version="${TAG#v}"
          args=(--provenance --access public)
          if [[ "${version%%+*}" == *-* ]]; then args+=(--tag next); fi
          packages=(./package-output/*.tgz)
          test "${#packages[@]}" = 1
          npm publish "${packages[0]}" "${args[@]}"

  verify-package:
    needs: [draft, publish]
    if: needs.draft.outputs.release_state == 'draft'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download expected tarball
        uses: actions/download-artifact@v8
        with:
          name: npm-payload
          path: expected

      - name: Verify registry tarball and provenance
        env:
          TAG: ${{ needs.draft.outputs.tag_name }}
        run: |
          set -euo pipefail
          timeout 60 npm view "@scottlz0310/renovate-config-init@${TAG#v}" --json > metadata.json
          tarball=$(jq -er '.dist.tarball' metadata.json)
          jq -er '.dist.attestations.url' metadata.json
          curl -fSL --connect-timeout 10 --max-time 60 "$tarball" -o registry.tgz
          packages=(expected/*.tgz)
          test "${#packages[@]}" = 1
          cmp "${packages[0]}" registry.tgz

  finalize:
    needs: [draft, publish, verify-package]
    if: needs.draft.outputs.release_state == 'draft'
    uses: scottlz0310/release-automate/.github/workflows/reusable-finalize-release.yml@3c860f1b178eb5b942d87c800153bc47887a7bfd # v3.2.1
    permissions:
      contents: write
    with:
      tag_name: ${{ needs.draft.outputs.tag_name }}
      target_sha: ${{ needs.draft.outputs.target_sha }}
      append_release_evidence: true
      verification_results: ${{ toJSON(needs) }}

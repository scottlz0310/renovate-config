# lefthook: renovate-config (TypeScript/Bun)
# pre-commit: Biome で format / lint / assist をステージ済みファイルに適用
# 対象言語と除外は biome.json に集約し、CI と同じ範囲を検査する。
# pre-push: 更新によって未変更ファイルにも生じる違反を全体チェックで検出する。
pre-commit:
  commands:
    biome:
      run: bun run biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  commands:
    check-ci:
      run: bun run check:ci
